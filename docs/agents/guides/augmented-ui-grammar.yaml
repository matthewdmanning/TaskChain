# Augmented-UI Grammar Spec
Positions:
  Corners: [tl, tr, br, bl]
  Edges: [t, r, b, l]

Cut Types:
  Corners:
    [
      none,
      clip,
      clip-x,
      clip-y,
      scoop,
      scoop-x,
      scoop-y,
      rect,
      rect-x,
      rect-y,
      step,
    ]
  Edges: [none, clip-x, clip-y, scoop-x, scoop-y, rect-x, rect-y]

Properties:
  Border: [width_dp, color_hex]
  Inlay: [inset_dp, fill_color_hex]
  Sizing: --aug-[position] dp_value

# Position Anchors
#
# `tl` (Top-Left): Origin vertex at `(0, 0)`. Offsets move right along the top edge and down along the left edge.
# `tr` (Top-Right): Vertex at `(width, 0)`. Offsets move left along the top edge and down along the right edge.
# `br` (Bottom-Right): Vertex at `(width, height)`. Offsets move left along the bottom edge and up along the right edge.
# `bl` (Bottom-Left): Vertex at `(0, height)`. Offsets move right along the bottom edge and up along the left edge.
# `t`, `r`, `b`, `l` (Edges): The continuous linear segments connecting corner vertices: Top, Right, Bottom, and Left respectively.
#
# ---
#
# Corner Cut Primitives
#
# `none`: Default unmodified 90-degree corner. Path travels directly to the vertex.
# `clip`: Symmetric 45-degree diagonal chamfer. Replaces the vertex with a single straight diagonal line between equal X and Y offsets.
# `clip-x`: Elongated asymmetric chamfer biased horizontally. The cut extends twice as far along the X-axis as along the Y-axis.
# `clip-y`: Elongated asymmetric chamfer biased vertically. The cut extends twice as far along the Y-axis as along the X-axis.
# `scoop`: Concave circular cutout. Curves inward toward the container center, creating a hollow rounded corner instead of a diagonal edge.
# `scoop-x` / `scoop-y`: Asymmetrical elliptical concave scoop biased along the respective axis.
# `rect`: Stepped right-angle notch. Cuts inward along one axis and returns along the other, creating an interior 90-degree square corner.
# `step`: Multi-tier staircase notch. Replaces the corner with two successive right-angle steps descending toward the corner bounds.
#
# ---
#
# Edge Cut Primitives
#
# `none`: Straight, unbroken perimeter edge connecting adjacent corner cuts.
# `rect`: Centered rectangular pocket or trench cut perpendicularly inward from the edge boundary.
# `clip-x` / `clip-y`: Symmetrical trapezoidal notch carved into the edge with angled 45-degree sides.
# `scoop`: Centered concave semi-circular scoop carved inward from the edge.
#
# ---
#
# Structural Properties
#
# `size`: Primary metric token (`Dp`) setting the penetration depth and width of the cut along the perimeter axes.
# `border`: Stroked path specification (`width: Dp, color: Color`) that traces the exact outer perimeter contour created by combined corner and edge cuts.
# `inlay`: Nested interior geometry (`inset: Dp, fill: Color`) generated by shrinking the perimeter path uniformly inward along its normal vectors.
